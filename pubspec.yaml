publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  pdf: ^3.11.2
  printing: ^5.14.2
  csv: ^6.0.0
  intl: ^0.20.2
  share_plus: ^10.1.4
